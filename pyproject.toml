[project]
name = "attic-herdr"
dynamic = ["version"]
description = "Archive idle herdr agent panes before reclaiming them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Pat Mannion" }]
keywords = ["herdr", "claude-code", "terminal", "session-management", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/TheThoughtagen/attic"
Repository = "https://github.com/TheThoughtagen/attic"
Issues = "https://github.com/TheThoughtagen/attic/issues"

[project.optional-dependencies]
tui = ["textual>=8,<9"]

[project.scripts]
attic = "attic.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The git tag is the version. A hardcoded version silently drifts from the tag
# and publishes the wrong one; PyPI accepts it and there is no taking it back.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"  # PyPI rejects local version segments

[tool.hatch.build.targets.wheel]
packages = ["src/attic"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
markers = ["integration: requires a live herdr server (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
