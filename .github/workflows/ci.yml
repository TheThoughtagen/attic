name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        # The TUI is an optional extra, but its tests are not optional — without
        # it they would silently skip via pytest.importorskip and CI would pass
        # while the dashboard was broken. Integration tests need a live herdr
        # and stay local-only (deselected by the addopts in pyproject.toml).
        run: uv run --extra tui --python ${{ matrix.python-version }} pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the wheel installs and the CLI runs
        # Guards the defect class that shipped twice on this project: the test
        # suite passing while the installed artifact was unusable, because the
        # dev checkout had dependencies the install path never provided.
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install "$(echo dist/*.whl)[tui]"
          /tmp/verify/bin/attic --help
          /tmp/verify/bin/python -c "import attic, attic.tui.app; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
